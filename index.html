<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; }
    button:disabled { cursor: wait; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="status" role="status"></p>
  <section id="result" hidden aria-live="polite" aria-labelledby="result-title">
    <h2 id="result-title">Результат разбора</h2>
    <p>Тема: <span id="topic"></span></p>
    <pre id="draft"></pre>
  </section>
  <script type="module">
    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const button = form.querySelector("button");
    const status = document.querySelector("#status");
    const result = document.querySelector("#result");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");
    const topicLabels = { delivery: "Доставка", pricing: "Стоимость", other: "Другое" };
    let pending = false;

    function clearResult() {
      topic.textContent = "";
      draft.textContent = "";
      result.hidden = true;
    }

    function showManualReview() {
      clearResult();
      status.textContent = "Автоматический разбор недоступен. Разберите заявку вручную: определите тему и подготовьте ответ клиенту.";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (pending) return;
      clearResult();
      const text = message.value.trim();
      if (!text) {
        status.textContent = "Введите текст заявки.";
        message.focus();
        return;
      }

      pending = true;
      button.disabled = true;
      message.readOnly = true;
      form.setAttribute("aria-busy", "true");
      status.textContent = "Разбираем заявку…";
      const controller = new AbortController();
      // Also stop waiting if the connection to our own API stalls.
      const timer = setTimeout(() => controller.abort(), 5_000);
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
          signal: controller.signal,
        });
        if (reply.status === 400) {
          status.textContent = "Введите текст заявки.";
          message.focus();
          return;
        }
        if (!reply.ok) throw new Error("API unavailable");
        const data = await reply.json();
        if (
          data?.status === "ready" && typeof data.topic === "string" &&
          Object.hasOwn(topicLabels, data.topic) &&
          typeof data.draft === "string" && data.draft.trim()
        ) {
          topic.textContent = topicLabels[data.topic];
          draft.textContent = data.draft;
          result.hidden = false;
          status.textContent = "Черновик готов. Проверьте его перед отправкой клиенту.";
        } else {
          showManualReview();
        }
      } catch {
        showManualReview();
      } finally {
        clearTimeout(timer);
        pending = false;
        button.disabled = false;
        message.readOnly = false;
        form.setAttribute("aria-busy", "false");
      }
    });
  </script>
</body>
</html>
